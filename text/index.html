<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transfer</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        h2 { margin-bottom: 5px; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .code-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .code { font-size: 2rem; font-weight: bold; color: #00ff88; letter-spacing: 2px; }
        .connect-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input, textarea {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input { flex: 1; text-align: center; }
        button {
            background: #007ff7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        textarea { width: 100%; height: 200px; resize: vertical; }
        .clear-btn { background: #ff3b30; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Text Transfer</h2>
    <div class="status" id="status">Connecting to sync relay...</div>

    <div class="code-box">
        <div>This Device Code</div>
        <div class="code" id="myCode">....</div>
    </div>

    <div class="connect-row">
        <input type="text" id="targetCode" placeholder="Enter other device code" maxlength="4">
        <button onclick="connectDevices()">Connect</button>
    </div>

    <textarea id="box" placeholder="Connect a device to start transferring text..." disabled></textarea>
    <button class="clear-btn" onclick="clearText()">Clear Text</button>

    <script>
        const box = document.getElementById('box');
        const status = document.getElementById('status');
        const myCodeDisplay = document.getElementById('myCode');
        
        const myCode = Math.floor(1000 + Math.random() * 9000).toString();
        myCodeDisplay.innerText = myCode;

        let activeRoom = null;
        let ws = null;

        // Connect directly to a free, serverless public WebSocket network
        // This bypasses external library script tag restrictions entirely
        function connectWebSocket() {
            ws = new WebSocket('wss://://hivemq.com');
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                status.innerText = "Ready to connect.";
                status.style.color = "#888";
                
                // Send MQTT Protocol connect packet manually via raw bytes
                const connectPacket = new Uint8Array([
                    0x10, 0x14, // Connect header
                    0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c, // Protocol name/info
                    0x00, 0x08, 0x63, 0x6c, 0x69, 0x65, 0x6e, 0x74, 0x31, 0x32 // Client ID
                ]);
                ws.send(connectPacket);
                
                // Subscribe to our own channel
                subscribeToChannel(myCode);
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') return;
                const bytes = new Uint8Array(event.data);
                
                // Look for payload markers inside raw packet bytes
                if (bytes[0] === 0x30) { 
                    try {
                        const rawStr = new TextDecoder().decode(bytes);
                        const jsonStart = rawStr.indexOf('{"type"');
                        if (jsonStart !== -1) {
                            const data = JSON.parse(rawStr.substring(jsonStart));
                            
                            if (data.type === 'handshake' && !activeRoom) {
                                activeRoom = myCode;
                                startSync();
                            }
                            if (data.sender !== myCode) {
                                if (data.type === 'input') box.value = data.val;
                                if (data.type === 'clear') box.value = "";
                            }
                        }
                    } catch(e) {}
                }
            };

            ws.onerror = () => {
                status.innerText = "Network block detected. Reconnecting...";
                status.style.color = "#ff3b30";
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }

        function subscribeToChannel(topicCode) {
            const topic = "t/" + topicCode;
            const tLen = topic.length;
            const subPacket = new Uint8Array([
                0x82, 5 + tLen, // Subscribe header
                0x00, 0x01,     // Message ID
                0x00, tLen,     // Topic length
                ...new TextEncoder().encode(topic),
                0x00            // QoS 0
            ]);
            if (ws.readyState === WebSocket.OPEN) ws.send(subPacket);
        }

        function publishMessage(topicCode, payload) {
            const topic = "t/" + topicCode;
            const tLen = topic.length;
            const msgBytes = new TextEncoder().encode(JSON.stringify(payload));
            const mLen = msgBytes.length;
            
            const pubHeader = new Uint8Array([
                0x30, 2 + tLen + mLen, // Publish header
                0x00, tLen,            // Topic length
                ...new TextEncoder().encode(topic)
            ]);
            
            const packet = new Uint8Array(pubHeader.length + msgBytes.length);
            packet.set(pubHeader);
            packet.set(msgBytes, pubHeader.length);
            
            if (ws.readyState === WebSocket.OPEN) ws.send(packet);
        }

        function connectDevices() {
            const target = document.getElementById('targetCode').value.trim();
            if(!target) return;
            
            activeRoom = target;
            subscribeToChannel(activeRoom);
            
            // Notify the other device
            publishMessage(activeRoom, { type: 'handshake' });
            startSync();
        }

        function startSync() {
            status.innerText = "Connected & Syncing";
            status.style.color = "#00ff88";
            box.disabled = false;
            box.placeholder = "Type or paste text here...";
        }

        box.addEventListener('input', () => {
            if (activeRoom) {
                publishMessage(activeRoom, {
                    type: 'input',
                    val: box.value,
                    sender: myCode
                });
            }
        });

        function clearText() {
            box.value = "";
            if (activeRoom) {
                publishMessage(activeRoom, {
                    type: 'clear',
                    sender: myCode
                });
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
