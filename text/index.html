<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transfer</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        h2 { margin-bottom: 5px; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .url-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            word-break: break-all;
            border: 1px dashed #444;
        }
        .url-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .url-text { font-family: monospace; color: #00ff88; font-size: 0.95rem; }
        textarea {
            width: 100%;
            height: 220px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            resize: vertical;
        }
        textarea:focus { border-color: #007ff7; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .copy-btn { background: #007ff7; color: white; }
        .clear-btn { background: #ff3b30; color: white; }
    </style>
</head>
<body>

    <h2>Text Transfer</h2>
    <div class="status">✅ 100% Offline & Security-Safe Mode</div>

    <!-- SHARED TEXT AREA -->
    <textarea id="box" placeholder="Type or paste your text here... The URL above will update instantly."></textarea>

    <div class="btn-row">
        <button class="copy-btn" onclick="copyLink()">📋 Copy Share Link</button>
        <button class="clear-btn" onclick="clearText()">🗑️ Clear Text</button>
    </div>

    <p style="margin-top: 25px; margin-bottom: 5px; font-size: 0.9rem; color: #888;">Your Shareable URL:</p>
    <div class="url-box">
        <div class="url-text" id="shareUrl">Loading link...</div>
    </div>

    <script>
        const box = document.getElementById('box');
        const shareUrl = document.getElementById('shareUrl');

        // 1. Safe base64 decoding for Unicode, emojis, and special symbols
        function decodeFromUrl() {
            if (window.location.hash) {
                try {
                    const base64Str = window.location.hash.substring(1);
                    const decodedText = decodeURIComponent(escape(atob(base64Str)));
                    box.value = decodedText;
                } catch (e) {
                    console.error("Failed to parse URL text data:", e);
                }
            }
            updateLinkDisplay();
        }

        // 2. Encode input text into the address bar hash component dynamically
        function encodeToUrl() {
            const text = box.value;
            if (!text.trim()) {
                window.history.replaceState(null, null, window.location.pathname);
            } else {
                const base64Str = btoa(unescape(encodeURIComponent(text)));
                window.history.replaceState(null, null, "#" + base64Str);
            }
            updateLinkDisplay();
        }

        function updateLinkDisplay() {
            shareUrl.innerText = window.location.href;
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Share Link copied to clipboard!");
        }

        function clearText() {
            box.value = "";
            window.history.replaceState(null, null, window.location.pathname);
            updateLinkDisplay();
        }

        // Event triggers
        box.addEventListener('input', encodeToUrl);
        window.addEventListener('load', decodeFromUrl);
    </script>
</body>
</html>
