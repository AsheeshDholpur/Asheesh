<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Text</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #status {
      height: 36px;
      padding: 9px 14px;
      font-size: 13px;
      color: #555;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    #dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      margin-right: 7px;
    }

    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 20px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="status">
    <span id="dot"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <textarea
    id="text"
    placeholder="Type or paste text..."
  ></textarea>


<script>

  /*
   * Your existing signaling server.
   * Nothing is changed on that server.
   */
  const SIGNALING_URL =
    "https://webrtc-signaling-server-6uvt.onrender.com";


  /*
   * Both browsers use the same room.
   * This is intended for your personal use.
   */
  const ROOM = "asheesh-text";


  const socket = io(SIGNALING_URL);


  const textBox = document.getElementById("text");
  const statusText = document.getElementById("statusText");
  const dot = document.getElementById("dot");


  let peer = null;
  let channel = null;

  let connected = false;
  let otherPeerFound = false;

  let myId = null;
  let otherId = null;


  /*
   * -------------------------
   * STATUS
   * -------------------------
   */

  function status(message, color) {

    statusText.textContent = message;
    dot.style.background = color;

    console.log("[TEXT]", message);
  }


  /*
   * -------------------------
   * CREATE WEBRTC PEER
   * -------------------------
   */

  function createPeer() {

    if (peer) {
      return;
    }

    peer = new RTCPeerConnection({

      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]

    });


    /*
     * ICE candidates
     */

    peer.onicecandidate = event => {

      if (!event.candidate) {
        return;
      }

      socket.emit("signal", {

        room: ROOM,

        data: {
          type: "ice",
          candidate: event.candidate
        }

      });

    };


    /*
     * Connection state
     */

    peer.onconnectionstatechange = () => {

      console.log(
        "WebRTC:",
        peer.connectionState
      );


      if (peer.connectionState === "connecting") {

        status(
          "Connecting to browser...",
          "#f0a000"
        );

      }


      if (peer.connectionState === "connected") {

        connected = true;

        status(
          "Connected",
          "#18a558"
        );

      }


      if (peer.connectionState === "disconnected") {

        connected = false;

        status(
          "Disconnected",
          "#d33"
        );

      }


      if (peer.connectionState === "failed") {

        connected = false;

        status(
          "Connection failed",
          "#d33"
        );

      }


      if (peer.connectionState === "closed") {

        connected = false;

        status(
          "Connection closed",
          "#999"
        );

      }

    };


    /*
     * Receive DataChannel from other browser
     */

    peer.ondatachannel = event => {

      console.log("DataChannel received");

      channel = event.channel;

      setupChannel();

    };

  }


  /*
   * -------------------------
   * DATA CHANNEL
   * -------------------------
   */

  function setupChannel() {

    if (!channel) {
      return;
    }


    channel.onopen = () => {

      console.log("DataChannel opened");

      connected = true;

      status(
        "Connected",
        "#18a558"
      );


      /*
       * Send current text when connection opens.
       */

      if (textBox.value.length > 0) {

        channel.send(textBox.value);

      }

    };


    channel.onmessage = event => {

      console.log("Text received");

      textBox.value = event.data;

    };


    channel.onclose = () => {

      connected = false;

      status(
        "Disconnected",
        "#d33"
      );

    };

  }


  /*
   * -------------------------
   * CREATE OFFER
   * -------------------------
   */

  async function createOffer() {

    console.log("Creating offer");

    createPeer();


    channel =
      peer.createDataChannel("text");


    setupChannel();


    const offer =
      await peer.createOffer();


    await peer.setLocalDescription(offer);


    socket.emit("signal", {

      room: ROOM,

      data: {
        type: "offer",
        offer: peer.localDescription
      }

    });


    status(
      "Browser found — connecting...",
      "#f0a000"
    );

  }


  /*
   * -------------------------
   * SOCKET CONNECTED
   * -------------------------
   */

  socket.on("connect", () => {

    myId = socket.id;

    console.log(
      "Socket connected:",
      myId
    );


    status(
      "Waiting for another browser...",
      "#f0a000"
    );


    /*
     * Join the same room.
     */

    socket.emit(
      "join",
      ROOM
    );


    /*
     * Announce ourselves.
     */

    socket.emit("signal", {

      room: ROOM,

      data: {

        type: "hello",

        id: myId

      }

    });

  });


  /*
   * -------------------------
   * SOCKET DISCONNECTED
   * -------------------------
   */

  socket.on("disconnect", () => {

    connected = false;

    status(
      "Signaling disconnected",
      "#d33"
    );

  });


  /*
   * -------------------------
   * SIGNALING MESSAGES
   * -------------------------
   */

  socket.on("signal", async data => {

    console.log(
      "Signal received:",
      data.type
    );


    /*
     * Another browser joined.
     */

    if (data.type === "hello") {

      otherPeerFound = true;

      otherId = data.id;


      /*
       * Deterministically choose ONE
       * browser to create the offer.
       *
       * The browser with the smaller
       * Socket.IO ID becomes initiator.
       */

      if (myId < otherId) {

        await createOffer();

      } else {

        status(
          "Browser found — waiting...",
          "#f0a000"
        );

      }

      return;
    }


    /*
     * -------------------------
     * OFFER
     * -------------------------
     */

    if (data.type === "offer") {

      console.log("Offer received");

      createPeer();


      await peer.setRemoteDescription(

        new RTCSessionDescription(
          data.offer
        )

      );


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      socket.emit("signal", {

        room: ROOM,

        data: {

          type: "answer",

          answer:
            peer.localDescription

        }

      });


      status(
        "Connecting to browser...",
        "#f0a000"
      );


      return;
    }


    /*
     * -------------------------
     * ANSWER
     * -------------------------
     */

    if (data.type === "answer") {

      console.log("Answer received");


      await peer.setRemoteDescription(

        new RTCSessionDescription(
          data.answer
        )

      );


      return;
    }


    /*
     * -------------------------
     * ICE
     * -------------------------
     */

    if (data.type === "ice") {

      try {

        await peer.addIceCandidate(

          new RTCIceCandidate(
            data.candidate
          )

        );

      } catch (error) {

        console.error(
          "ICE error:",
          error
        );

      }

    }

  });


  /*
   * -------------------------
   * LIVE TEXT TRANSFER
   * -------------------------
   */

  let typingTimer = null;


  textBox.addEventListener(
    "input",
    () => {

      if (!connected) {
        return;
      }


      if (!channel) {
        return;
      }


      if (channel.readyState !== "open") {
        return;
      }


      clearTimeout(
        typingTimer
      );


      typingTimer = setTimeout(
        () => {

          channel.send(
            textBox.value
          );

        },
        30
      );

    }
  );

</script>

</body>
</html>
