<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    textarea {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 0;
      outline: 0;
      resize: none;
      padding: 20px;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }
  </style>
</head>

<body>

<textarea id="text" placeholder="Type or paste text..."></textarea>

<script>
  // SIGNALING SERVER URL
  const SIGNALING_URL = "https://webrtc-signaling-server-6uvt.onrender.com";

  const ROOM = "asheesh-text";

  const socket = io(SIGNALING_URL);

  const textBox = document.getElementById("text");

  let peer = null;
  let channel = null;
  let myId = null;
  let otherId = null;
  let ready = false;

  const rtcConfig = {
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  };


  // -----------------------------
  // WebRTC
  // -----------------------------

  function createPeer() {

    peer = new RTCPeerConnection(rtcConfig);

    peer.onicecandidate = event => {

      if (!event.candidate) return;

      socket.emit("signal", {
        room: ROOM,
        data: {
          type: "ice",
          candidate: event.candidate
        }
      });
    };


    peer.ondatachannel = event => {

      channel = event.channel;

      setupChannel();
    };


    peer.onconnectionstatechange = () => {

      if (peer.connectionState === "connected") {
        ready = true;
      }

      if (
        peer.connectionState === "failed" ||
        peer.connectionState === "closed" ||
        peer.connectionState === "disconnected"
      ) {
        ready = false;
      }
    };
  }


  function setupChannel() {

    channel.onopen = () => {

      ready = true;

      // Send current text to the other browser
      if (textBox.value) {
        channel.send(textBox.value);
      }
    };


    channel.onmessage = event => {

      // Prevent overwriting while the user is typing
      textBox.value = event.data;
    };


    channel.onclose = () => {
      ready = false;
    };
  }


  async function becomeInitiator() {

    if (!peer) {
      createPeer();
    }

    channel = peer.createDataChannel("text");

    setupChannel();

    const offer = await peer.createOffer();

    await peer.setLocalDescription(offer);

    socket.emit("signal", {
      room: ROOM,
      data: {
        type: "offer",
        offer: peer.localDescription
      }
    });
  }


  // -----------------------------
  // Socket.IO
  // -----------------------------

  socket.on("connect", () => {

    myId = socket.id;

    createPeer();

    // Everyone joins the same private room
    socket.emit("join", ROOM);

    // Tell the other browser who we are
    socket.emit("signal", {
      room: ROOM,
      data: {
        type: "hello",
        id: myId
      }
    });
  });


  socket.on("signal", async data => {

    if (!data) return;


    // -----------------------------
    // Detect the other browser
    // -----------------------------

    if (data.type === "hello") {

      otherId = data.id;

      /*
        The browser with the smaller Socket.IO ID
        becomes the initiator.

        This avoids both browsers creating offers
        simultaneously.
      */

      if (myId < otherId) {
        await becomeInitiator();
      }

      return;
    }


    // -----------------------------
    // Receive offer
    // -----------------------------

    if (data.type === "offer") {

      if (!peer) {
        createPeer();
      }

      await peer.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer = await peer.createAnswer();

      await peer.setLocalDescription(answer);

      socket.emit("signal", {
        room: ROOM,
        data: {
          type: "answer",
          answer: peer.localDescription
        }
      });

      return;
    }


    // -----------------------------
    // Receive answer
    // -----------------------------

    if (data.type === "answer") {

      await peer.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );

      return;
    }


    // -----------------------------
    // Receive ICE candidate
    // -----------------------------

    if (data.type === "ice") {

      try {

        await peer.addIceCandidate(
          new RTCIceCandidate(data.candidate)
        );

      } catch (error) {

        console.error("ICE error:", error);

      }

      return;
    }

  });


  // -----------------------------
  // Live text sharing
  // -----------------------------

  let typingTimer;

  textBox.addEventListener("input", () => {

    if (!ready || !channel) return;

    if (channel.readyState !== "open") return;

    clearTimeout(typingTimer);

    typingTimer = setTimeout(() => {

      channel.send(textBox.value);

    }, 30);
  });

</script>

</body>
</html>
