<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transfer</title>
    <!-- Enterprise Grade Messaging Client -->
    <script src="https://unpkg.com" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        h2 { margin-bottom: 5px; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; transition: color 0.3s; }
        .code-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .code { font-size: 2rem; font-weight: bold; color: #00ff88; letter-spacing: 2px; }
        .connect-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input, textarea {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input { flex: 1; text-align: center; }
        button {
            background: #007ff7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        textarea { width: 100%; height: 200px; resize: vertical; }
        .clear-btn { background: #ff3b30; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Text Transfer</h2>
    <div class="status" id="status">Establishing secure connection...</div>

    <div class="code-box">
        <div>This Device Code</div>
        <div class="code" id="myCode">....</div>
    </div>

    <div class="connect-row">
        <input type="text" id="targetCode" placeholder="Enter other device code" maxlength="4">
        <button onclick="connectDevices()">Connect</button>
    </div>

    <textarea id="box" placeholder="Connect a device to start transferring text..." disabled></textarea>
    <button class="clear-btn" onclick="clearText()">Clear Text</button>

    <script>
        const box = document.getElementById('box');
        const status = document.getElementById('status');
        const myCodeDisplay = document.getElementById('myCode');
        
        const myCode = Math.floor(1000 + Math.random() * 9000).toString();
        myCodeDisplay.innerText = myCode;

        let activeRoom = null;
        let client = null;

        function startClient() {
            if (typeof Paho === 'undefined') {
                status.innerText = "Network security block: CDN failed to load.";
                status.style.color = "#ff3b30";
                return;
            }

            // Using standard cloud relay configs with strict endpoint maps
            const clientId = "txt_" + Math.random().toString(16).substr(2, 8);
            client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientId);

            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                useSSL: true,
                timeout: 10,
                keepAliveInterval: 30
            });
        }

        function onConnect() {
            status.innerText = "Ready to connect.";
            status.style.color = "#888";
            client.subscribe("txtshare/" + myCode);
        }

        function onFailure(response) {
            status.innerText = "Sync service busy. Retrying connection...";
            status.style.color = "#ff3b30";
            setTimeout(startClient, 4000);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                status.innerText = "Network dropped. Reconnecting...";
                status.style.color = "#ff3b30";
                setTimeout(startClient, 3000);
            }
        }

        function connectDevices() {
            const target = document.getElementById('targetCode').value.trim();
            if(!target || !client || !client.isConnected()) return;
            
            if (activeRoom) {
                client.unsubscribe("txtshare/" + activeRoom);
            }
            
            activeRoom = target;
            client.subscribe("txtshare/" + activeRoom);
            
            const message = new Paho.MQTT.Message(JSON.stringify({ type: 'handshake', sender: myCode }));
            message.destinationName = "txtshare/" + activeRoom;
            client.send(message);
            
            startSync();
        }

        function startSync() {
            status.innerText = "Connected & Syncing";
            status.style.color = "#00ff88";
            box.disabled = false;
            box.placeholder = "Type or paste text here...";
        }

        function onMessageArrived(message) {
            try {
                const data = JSON.parse(message.payloadString);
                
                if (data.type === 'handshake' && data.sender !== myCode && !activeRoom) {
                    activeRoom = myCode;
                    startSync();
                }
                
                if (data.sender !== myCode) {
                    if (data.type === 'input') box.value = data.val;
                    if (data.type === 'clear') box.value = "";
                }
            } catch(e) {}
        }

        box.addEventListener('input', () => {
            if (activeRoom && client && client.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify({
                    type: 'input',
                    val: box.value,
                    sender: myCode
                }));
                message.destinationName = "txtshare/" + activeRoom;
                client.send(message);
            }
        });

        function clearText() {
            box.value = "";
            if (activeRoom && client && client.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify({
                    type: 'clear',
                    sender: myCode
                }));
                message.destinationName = "txtshare/" + activeRoom;
                client.send(message);
            }
        }

        window.onload = startClient;
    </script>
</body>
</html>
