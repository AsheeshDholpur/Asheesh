<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Text</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #status {
      height: 36px;
      padding: 9px 14px;
      font-size: 13px;
      color: #555;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    #dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      margin-right: 7px;
    }

    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 20px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    #status {
  height: 36px;
  padding: 4px 14px;
  font-size: 13px;
  color: #555;
  border-bottom: 1px solid #ddd;
  background: #fafafa;

  display: flex;
  align-items: center;
}

#buttons {
  margin-left: auto;
  display: flex;
  gap: 30px;
}

#buttons button {
  padding: 5px 14px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 4px;
}

    body.dark {
  background: #1e1e1e;
  color: #ddd;
}

body.dark #status {
  background: #252525;
  color: #ccc;
  border-bottom-color: #444;
}

body.dark textarea {
  background: #1e1e1e;
  color: #ddd;
}

body.dark #buttons button {
  background: #333;
  color: #eee;
  border-color: #555;
}

#themeBtn {
  width: 30px;
  padding: 5px 0 !important;
}

  </style>
</head>

<body>

<div id="status">
  <span id="dot"></span>
  <span id="statusText">Connecting...</span>

  <div id="buttons">
    <button id="pasteBtn">Paste</button>
    <button id="copyBtn">Copy</button>
    <button id="themeBtn" title="Toggle dark mode">🌙</button>
  </div>
</div>

<textarea
  id="text"
  placeholder="Type or paste text..."
></textarea>


<script>

  // Your existing signaling server
  const SIGNALING_URL =
    "https://webrtc-signaling-server-6uvt.onrender.com";

  // Same room for your personal two-browser sharing
  const ROOM = "asheesh-text";


  const socket = io(SIGNALING_URL);

  const textBox =
    document.getElementById("text");

  const statusText =
    document.getElementById("statusText");

  const dot =
    document.getElementById("dot");


  let peer = null;
  let channel = null;

  let myId = null;
  let otherId = null;

  let connected = false;
  let remoteDescriptionSet = false;

  // ICE candidates can arrive before the
  // remote description. Keep them here.
  let pendingCandidates = [];


  /*
   * -----------------------------
   * STATUS
   * -----------------------------
   */

  function status(message, color) {

    statusText.textContent = message;
    dot.style.background = color;

    console.log("[TEXT]", message);
  }


  /*
   * -----------------------------
   * CREATE PEER
   * -----------------------------
   */

  function createPeer() {

    if (peer) {
      return peer;
    }


    peer = new RTCPeerConnection({

      iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:global.stun.twilio.com:3478" }
]

    });


    /*
     * ICE candidate
     */

    peer.onicecandidate = event => {

      if (!event.candidate) {
        return;
      }

      console.log(
        "[WEBRTC] Sending ICE candidate"
      );

      socket.emit("signal", {

        room: ROOM,

        data: {

          type: "ice",

          candidate: event.candidate

        }

      });

    };


    /*
     * DataChannel received
     */

    peer.ondatachannel = event => {

      console.log(
        "[WEBRTC] DataChannel received"
      );

      channel = event.channel;

      setupChannel();

    };


    /*
     * Connection state
     */

    peer.onconnectionstatechange = () => {

      console.log(
        "[WEBRTC] Connection:",
        peer.connectionState
      );


      if (
        peer.connectionState === "new"
      ) {

        status(
          "Connecting...",
          "#f0a000"
        );

      }


      if (
        peer.connectionState === "connecting"
      ) {

        status(
          "Connecting...",
          "#f0a000"
        );

      }


      if (
        peer.connectionState === "connected"
      ) {

        connected = true;

        status(
          "Connected",
          "#18a558"
        );

      }


      if (
        peer.connectionState === "disconnected"
      ) {

        connected = false;

        status(
          "Connection interrupted",
          "#d88a00"
        );

      }


      if (
        peer.connectionState === "failed"
      ) {

        connected = false;

        status(
          "WebRTC connection failed",
          "#d33"
        );

        console.error(
          "[WEBRTC] Connection failed"
        );

      }


      if (
        peer.connectionState === "closed"
      ) {

        connected = false;

        status(
          "Connection closed",
          "#999"
        );

      }

    };


    /*
     * ICE connection state
     */

    peer.oniceconnectionstatechange = () => {

      console.log(
        "[WEBRTC] ICE:",
        peer.iceConnectionState
      );

    };


    return peer;
  }


  /*
   * -----------------------------
   * DATA CHANNEL
   * -----------------------------
   */

  function setupChannel() {

    if (!channel) {
      return;
    }


    channel.onopen = () => {

      console.log(
        "[WEBRTC] DataChannel OPEN"
      );

      connected = true;

      status(
        "Connected",
        "#18a558"
      );


      /*
       * Send existing text immediately.
       */

      if (textBox.value) {

        channel.send(
          textBox.value
        );

      }

    };


    channel.onmessage = event => {

      console.log(
        "[WEBRTC] Text received"
      );

      textBox.value = event.data;

    };


    channel.onclose = () => {

      connected = false;

      status(
        "Disconnected",
        "#d33"
      );

    };


    channel.onerror = error => {

      console.error(
        "[WEBRTC] DataChannel error:",
        error
      );

    };

  }


  /*
   * -----------------------------
   * INITIATOR
   * -----------------------------
   */

  async function createOffer() {

    console.log(
      "[WEBRTC] Creating offer"
    );


    const pc = createPeer();


    /*
     * Only the initiator creates
     * the DataChannel.
     */

    channel =
      pc.createDataChannel("text");


    setupChannel();


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    socket.emit("signal", {

      room: ROOM,

      data: {

        type: "offer",

        offer:
          pc.localDescription

      }

    });


    status(
      "Browser found — connecting...",
      "#f0a000"
    );

  }


  /*
   * -----------------------------
   * SOCKET CONNECTED
   * -----------------------------
   */

  socket.on("connect", () => {

    myId = socket.id;


    console.log(
      "[SOCKET] Connected:",
      myId
    );


    status(
      "Waiting for another browser...",
      "#f0a000"
    );


    /*
     * Join room.
     */

    socket.emit(
      "join",
      ROOM
    );


    /*
     * Tell existing browser that
     * we have arrived.
     */

    socket.emit("signal", {

      room: ROOM,

      data: {

        type: "hello",

        id: myId

      }

    });

  });


  /*
   * -----------------------------
   * SOCKET DISCONNECTED
   * -----------------------------
   */

  socket.on("disconnect", () => {

    connected = false;

    status(
      "Signaling disconnected",
      "#d33"
    );

  });


  /*
   * -----------------------------
   * SIGNAL
   * -----------------------------
   */

  socket.on("signal", async data => {

    if (!data) {
      return;
    }


    console.log(
      "[SIGNAL]",
      data.type
    );


    /*
     * ---------------------------
     * HELLO
     * ---------------------------
     */

    if (data.type === "hello") {

      otherId = data.id;


      console.log(
        "[SIGNAL] Other browser:",
        otherId
      );


      /*
       * Deterministically select
       * ONE browser as initiator.
       *
       * Only the browser with the
       * smaller ID creates the offer.
       */

      if (myId < otherId) {

        await createOffer();

      } else {

        status(
          "Browser found — waiting...",
          "#f0a000"
        );

      }


      return;
    }


    /*
     * ---------------------------
     * OFFER
     * ---------------------------
     */

    if (data.type === "offer") {

      console.log(
        "[WEBRTC] Offer received"
      );


      const pc =
        createPeer();


      await pc.setRemoteDescription(

        new RTCSessionDescription(
          data.offer
        )

      );


      remoteDescriptionSet = true;


      /*
       * Add any ICE candidates
       * that arrived early.
       */

      await flushCandidates();


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit("signal", {

        room: ROOM,

        data: {

          type: "answer",

          answer:
            pc.localDescription

        }

      });


      status(
        "Connecting...",
        "#f0a000"
      );


      return;
    }


    /*
     * ---------------------------
     * ANSWER
     * ---------------------------
     */

    if (data.type === "answer") {

      console.log(
        "[WEBRTC] Answer received"
      );


      if (!peer) {
        return;
      }


      await peer.setRemoteDescription(

        new RTCSessionDescription(
          data.answer
        )

      );


      remoteDescriptionSet = true;


      await flushCandidates();


      return;
    }


    /*
     * ---------------------------
     * ICE CANDIDATE
     * ---------------------------
     */

    if (data.type === "ice") {

      console.log(
        "[WEBRTC] ICE candidate received"
      );


      /*
       * If remote description isn't
       * ready yet, save the candidate.
       */

      if (!remoteDescriptionSet) {

        pendingCandidates.push(
          data.candidate
        );

        return;
      }


      try {

        await peer.addIceCandidate(

          new RTCIceCandidate(
            data.candidate
          )

        );

      } catch (error) {

        console.error(
          "[WEBRTC] ICE candidate error:",
          error
        );

      }


      return;
    }

  });


  /*
   * -----------------------------
   * FLUSH ICE CANDIDATES
   * -----------------------------
   */

  async function flushCandidates() {

    if (!peer) {
      return;
    }


    if (!remoteDescriptionSet) {
      return;
    }


    while (
      pendingCandidates.length > 0
    ) {

      const candidate =
        pendingCandidates.shift();


      try {

        await peer.addIceCandidate(

          new RTCIceCandidate(
            candidate
          )

        );

      } catch (error) {

        console.error(
          "[WEBRTC] Queued ICE error:",
          error
        );

      }

    }

  }


  /*
   * -----------------------------
   * LIVE TEXT
   * -----------------------------
   */

  let typingTimer = null;


  textBox.addEventListener(
    "input",
    () => {

      if (!connected) {
        return;
      }


      if (!channel) {
        return;
      }


      if (
        channel.readyState !== "open"
      ) {
        return;
      }


      clearTimeout(
        typingTimer
      );


      typingTimer = setTimeout(
        () => {

          if (
            channel &&
            channel.readyState === "open"
          ) {

            channel.send(
              textBox.value
            );

          }

        },
        30
      );

    }
  );

  const pasteBtn = document.getElementById("pasteBtn");
const copyBtn = document.getElementById("copyBtn");

pasteBtn.addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();

    textBox.value = text;

    // Trigger your existing live-sync code
    textBox.dispatchEvent(new Event("input"));

  } catch (error) {
    console.error("Paste failed:", error);
  }
});


copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(textBox.value);

  } catch (error) {
    console.error("Copy failed:", error);
  }
});

  const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    themeBtn.textContent = "☀️";
    themeBtn.title = "Switch to light mode";
  } else {
    themeBtn.textContent = "🌙";
    themeBtn.title = "Switch to dark mode";
  }

});

</script>

</body>
</html>
