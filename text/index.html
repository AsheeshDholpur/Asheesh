<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 350px;
      resize: vertical;
      padding: 15px;
      font: inherit;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    textarea:focus {
      border-color: #777;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    input, button {
      padding: 10px 14px;
      font: inherit;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #f3f3f3;
    }

    #status {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main>

  <textarea id="text" placeholder="Type or paste text..."></textarea>

  <div class="controls">
    <input id="room" placeholder="Room ID">
    <button id="connect">Connect</button>
    <button id="send">Send</button>
  </div>

  <div id="status"></div>

</main>

<script>
  // CHANGE THIS
  const SIGNALING_URL = "https://YOUR-SIGNALING-SERVER-URL";

  const textBox = document.getElementById("text");
  const roomInput = document.getElementById("room");
  const status = document.getElementById("status");

  const socket = io(SIGNALING_URL);

  let peerConnection = null;
  let dataChannel = null;
  let isInitiator = false;

  const rtcConfig = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  };

  function setStatus(message) {
    status.textContent = message;
  }

  function createPeerConnection() {
    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.onicecandidate = event => {
      if (event.candidate) {
        socket.emit("signal", {
          room: roomInput.value,
          candidate: event.candidate
        });
      }
    };

    peerConnection.onconnectionstatechange = () => {
      setStatus("Connection: " + peerConnection.connectionState);
    };

    peerConnection.ondatachannel = event => {
      dataChannel = event.channel;

      dataChannel.onopen = () => {
        setStatus("Connected");
      };

      dataChannel.onmessage = event => {
        textBox.value = event.data;
      };
    };
  }

  document.getElementById("connect").onclick = async () => {

    const room = roomInput.value.trim();

    if (!room) {
      setStatus("Enter a room ID");
      return;
    }

    createPeerConnection();

    socket.emit("join", room);

    setStatus("Connecting...");

    // Wait briefly to determine whether this browser
    // should create the offer.
    setTimeout(async () => {

      if (isInitiator) {
        dataChannel = peerConnection.createDataChannel("text");

        dataChannel.onopen = () => {
          setStatus("Connected");
        };

        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        socket.emit("signal", {
          room,
          offer: peerConnection.localDescription
        });
      }

    }, 500);
  };

  document.getElementById("send").onclick = () => {

    if (!dataChannel || dataChannel.readyState !== "open") {
      setStatus("Not connected");
      return;
    }

    dataChannel.send(textBox.value);

    setStatus("Sent");
  };

  socket.on("connect", () => {
    setStatus("Ready");
  });

  socket.on("signal", async data => {

    if (!peerConnection) return;

    if (data.offer) {

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer = await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(answer);

      socket.emit("signal", {
        room: roomInput.value,
        answer: peerConnection.localDescription
      });
    }

    if (data.answer) {

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );
    }

    if (data.candidate) {

      try {
        await peerConnection.addIceCandidate(
          new RTCIceCandidate(data.candidate)
        );
      } catch (error) {
        console.error(error);
      }
    }
  });

  /*
    The signaling server should tell the first
    browser in the room that it is the initiator.

    If your existing server does not send such
    an event, the signaling server needs a tiny
    change to support this.
  */

  socket.on("initiator", () => {
    isInitiator = true;
  });

</script>

</body>
</html>
