<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transfer</title>
    <!-- Stable PeerJS CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        h2 { margin-bottom: 5px; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .code-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .code { font-size: 2rem; font-weight: bold; color: #00ff88; letter-spacing: 2px; }
        .connect-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input, textarea {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input { flex: 1; text-align: center; }
        button {
            background: #007ff7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        textarea { width: 100%; height: 200px; resize: vertical; }
        .clear-btn { background: #ff3b30; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Text Transfer</h2>
    <div class="status" id="status">Connecting to network...</div>

    <div class="code-box">
        <div>This Device Code</div>
        <div class="code" id="myCode">....</div>
    </div>

    <div class="connect-row">
        <input type="text" id="targetCode" placeholder="Enter other device code" maxlength="4">
        <button onclick="connectDevices()">Connect</button>
    </div>

    <textarea id="box" placeholder="Connect a device to start transferring text..." disabled></textarea>
    <button class="clear-btn" onclick="clearText()">Clear Text</button>

    <script>
        let peer = null, conn = null;
        const box = document.getElementById('box');
        const status = document.getElementById('status');
        
        // Generates a distinct room string to prevent user namespace collision
        const codeId = Math.floor(1000 + Math.random() * 9000).toString();

        // Connected to alternative high-availability public signaling infrastructure
        peer = new Peer('txt-share-' + codeId, {
            host: '://peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            config: {'iceServers': [{ 'urls': 'stun:://google.com' }]}
        });
        
        peer.on('open', () => {
            document.getElementById('myCode').innerText = codeId;
            status.innerText = "Ready to connect.";
            status.style.color = "#888";
        });

        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            startSync();
        });

        peer.on('error', (err) => {
            status.innerText = "Connection lost. Retrying...";
            status.style.color = "#ff3b30";
            console.error("PeerJS Error: ", err);
        });

        function connectDevices() {
            const target = document.getElementById('targetCode').value.trim();
            if(!target) return;
            status.innerText = "Connecting...";
            conn = peer.connect('txt-share-' + target);
            conn.on('open', startSync);
        }

        function startSync() {
            status.innerText = "Connected & Syncing";
            status.style.color = "#00ff88";
            box.disabled = false;
            box.placeholder = "Type or paste text here...";

            conn.on('data', (data) => {
                if (data.type === 'input') box.value = data.val;
                if (data.type === 'clear') box.value = "";
            });
        }

        box.addEventListener('input', () => {
            if (conn && conn.open) conn.send({ type: 'input', val: box.value });
        });

        function clearText() {
            box.value = "";
            if (conn && conn.open) conn.send({ type: 'clear' });
        }
    </script>
</body>
</html>
