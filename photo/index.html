<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto AI Passport Cropper + Enhance + Bulk Download</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet">

    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; text-align: center; padding-bottom: 100px; }
        .header { margin-bottom: 20px; }
        #status { font-weight: bold; color: #fbbf24; margin-bottom: 20px; }
        
        input[type="file"] { padding: 10px; background: #222; border: 1px solid #444; border-radius: 5px; color: white; cursor: pointer; }

        #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }

        .crop-card { background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; position: relative; }

        .status-badge { width: 100%; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem; }
        .status-processing { background-color: #8b5cf6; color: white; }
        .status-success { background-color: #10b981; color: white; }
        .status-error { background-color: #ef4444; color: white; }

        .img-container { width: 100%; height: 400px; background: #000; margin-bottom: 15px; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-container img { display: block; max-width: 100%; max-height: 100%; }

        .button-group { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: all 0.2s; }

        .crop-btn { background-color: #3b82f6; color: white; }
        .crop-btn:hover { background-color: #2563eb; }

        .enhance-btn { background-color: #f59e0b; color: white; display: none; }
        .enhance-btn:hover:not(:disabled) { background-color: #d97706; }
        .enhance-btn:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        .download-btn { background-color: #00ff99; color: #000; }
        .download-btn:hover:not(:disabled) { background-color: #00cc7a; }
        .download-btn:disabled { background-color: #444; color: #888; cursor: not-allowed; opacity: 0.6; }

        /* 🔥 NEW FAB STYLES */
        #fab-download-all {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 75px;
            height: 75px;
            background-color: #00ff99;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0, 255, 153, 0.4);
            display: none; /* Hidden until upload */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            border: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        #fab-download-all:hover {
            transform: scale(1.1);
            background-color: #00cc7a;
        }
        #fab-download-all svg {
            width: 35px; height: 35px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>AI Photo Edit Studio</h2>
        <p>Upload photos. The AI frames them. Confirm, enhance, and download all at once.</p>
        <div id="status">⏳ Downloading AI Face Models... please wait.</div>
        <input type="file" id="upload" multiple accept="image/*" disabled>
    </div>

    <div id="grid-container"></div>

    <button id="fab-download-all" onclick="downloadAllZip()" title="Download All (ZIP)">
        <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        let isAiLoaded = false;
        const statusDiv = document.getElementById('status');
        const uploadInput = document.getElementById('upload');
        const gridContainer = document.getElementById('grid-container');
        const fab = document.getElementById('fab-download-all');

        // 🔥 Tracker Array to monitor the status of all files
        let imageRegistry = [];

        async function loadAI() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            isAiLoaded = true;
            statusDiv.textContent = "✅ AI Ready! Upload your photos.";
            statusDiv.style.color = "#00ff99";
            uploadInput.disabled = false; 
        }
        loadAI();

        uploadInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            // Show the floating button
            fab.style.display = 'flex';

            files.forEach(file => {
                // Register this image in our global array
                const imgRecord = {
                    originalName: file.name.replace(/\.[^/.]+$/, ""),
                    finalUrl: null // Will be populated once confirmed
                };
                imageRegistry.push(imgRecord);
                
                createCropCard(file, imgRecord);
            });
        });

        function createCropCard(file, imgRecord) {
            const card = document.createElement('div');
            card.className = 'crop-card';

            const statusBadge = document.createElement('div');
            statusBadge.className = 'status-badge status-processing';
            statusBadge.textContent = '⏳ AI Scanning...';

            const imgContainer = document.createElement('div');
            imgContainer.className = 'img-container';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            
            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'button-group';

            const cropBtn = document.createElement('button');
            cropBtn.className = 'crop-btn';
            cropBtn.textContent = '✂️ Confirm Crop';

            const enhanceBtn = document.createElement('button');
            enhanceBtn.className = 'enhance-btn';
            enhanceBtn.textContent = '🪄 Magic Enhance';

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = '⬇ Download ' + imgRecord.originalName + '.png';
            downloadBtn.disabled = true;

            imgContainer.appendChild(img);
            buttonGroup.appendChild(cropBtn);
            buttonGroup.appendChild(enhanceBtn);
            buttonGroup.appendChild(downloadBtn);
            
            card.appendChild(statusBadge);
            card.appendChild(imgContainer);
            card.appendChild(buttonGroup);
            gridContainer.appendChild(card);

            img.onload = () => {
                let cropper = new Cropper(img, {
                    aspectRatio: 3 / 4,
                    viewMode: 1,
                    guides: true,
                    autoCropArea: 0.5,
                    
                    async ready() {
                        if (!isAiLoaded) return;
                        const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions());

                        if (detection) {
                            const face = detection.box;
                            const targetHeight = face.height * 2.1; 
                            const targetWidth = targetHeight * 0.75; 
                            const faceCenterX = face.x + (face.width / 2);
                            const targetX = faceCenterX - (targetWidth / 2);
                            const targetY = face.y - (targetHeight * 0.22); 

                            cropper.setData({
                                x: targetX, y: targetY, width: targetWidth, height: targetHeight
                            });

                            statusBadge.textContent = '✨ Face Framed!';
                            statusBadge.className = 'status-badge status-success';
                        } else {
                            statusBadge.textContent = '❌ No Face Found (Adjust Manually)';
                            statusBadge.className = 'status-badge status-error';
                        }
                    }
                });

                cropBtn.addEventListener('click', () => {
                    const canvas = cropper.getCroppedCanvas();
                    if (!canvas) return;

                    canvas.toBlob((blob) => {
                        const croppedUrl = URL.createObjectURL(blob);
                        
                        // 🔥 Update the global tracker that this image is confirmed
                        imgRecord.finalUrl = croppedUrl;
                        
                        cropper.destroy(); 
                        img.onload = null; 
                        
                        img.src = croppedUrl; 
                        img.style.objectFit = "contain"; 

                        statusBadge.style.display = 'none'; 
                        cropBtn.style.display = 'none'; 
                        
                        enhanceBtn.style.display = 'block';
                        downloadBtn.disabled = false;   
                    }, 'image/png');
                });

                enhanceBtn.addEventListener('click', () => {
                    enhanceBtn.textContent = '🪄 Enhancing...';
                    enhanceBtn.disabled = true; 

                    const hiddenCanvas = document.createElement('canvas');
                    const ctx = hiddenCanvas.getContext('2d');
                    const tempImg = new Image();
                    tempImg.src = imgRecord.finalUrl;
                    
                    tempImg.onload = () => {
                        hiddenCanvas.width = tempImg.width;
                        hiddenCanvas.height = tempImg.height;
                        
                        ctx.filter = 'contrast(1.15) saturate(1.2) brightness(1.05)';
                        ctx.drawImage(tempImg, 0, 0);
                        
                        hiddenCanvas.toBlob((blob) => {
                            URL.revokeObjectURL(imgRecord.finalUrl); 
                            const enhancedUrl = URL.createObjectURL(blob);
                            
                            // 🔥 Update tracker with the new enhanced image
                            imgRecord.finalUrl = enhancedUrl;
                            img.src = enhancedUrl;
                            enhanceBtn.textContent = '✅ Enhanced!';
                        }, 'image/png');
                    };
                });

                downloadBtn.addEventListener('click', () => {
                    if (!imgRecord.finalUrl) return;
                    const link = document.createElement('a');
                    link.href = imgRecord.finalUrl;
                    link.download = imgRecord.originalName + '.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
            };
        }

        // 🔥 THE BULK DOWNLOAD LOGIC
        async function downloadAllZip() {
            // 1. Validation Gate
            const unconfirmedImages = imageRegistry.filter(img => img.finalUrl === null);
            
            if (unconfirmedImages.length > 0) {
                alert(`⚠️ Please click "Confirm Crop" on the remaining ${unconfirmedImages.length} image(s) before downloading all.`);
                return; // Stop the function from proceeding
            }

            // 2. Change icon to indicate processing
            fab.innerHTML = "⏳";
            fab.style.pointerEvents = "none";

            // 3. Create the ZIP
            const zip = new JSZip();
            
            // Loop through our registry and fetch the blobs
            for (let i = 0; i < imageRegistry.length; i++) {
                const img = imageRegistry[i];
                try {
                    // Fetch the blob data from our Object URL
                    const response = await fetch(img.finalUrl);
                    const blob = await response.blob();
                    
                    // Add it to the zip file
                    zip.file(img.originalName + ".png", blob);
                } catch (err) {
                    console.error("Error zipping file:", img.originalName);
                }
            }

            // 4. Generate and download the ZIP
            const zipContent = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipContent);
            link.download = "Passport_Photos.zip";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // 5. Restore the button
            fab.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>`;
            fab.style.pointerEvents = "auto";
        }
    </script>
</body>
</html>
