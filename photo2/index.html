<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo & Signature Cropper - Compressed (10KB - 50KB)</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet">

    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; text-align: center; padding-bottom: 100px; }
        .header { margin-bottom: 20px; }
        #status { font-weight: bold; color: #fbbf24; margin-bottom: 15px; }
        
        .add-card-btn { background-color: #10b981; color: white; padding: 12px 25px; font-size: 1rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .add-card-btn:hover { background-color: #059669; }
        .add-card-btn:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; max-width: 1400px; margin: 20px auto 0 auto; }

        .crop-card { background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid #333; }

        .naming-box { width: 100%; margin-bottom: 12px; display: flex; flex-direction: column; align-items: flex-start; }
        .naming-box label { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
        .naming-box input { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; font-weight: bold; }

        .pair-container { display: flex; width: 100%; gap: 10px; margin-bottom: 15px; }
        .pane { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .pane-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #38bdf8; }

        .file-label { display: block; width: 100%; background: #2563eb; color: white; padding: 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; text-align: center; margin-bottom: 8px; font-weight: bold; }
        .file-label:hover { background-color: #1d4ed8; }
        .file-label input { display: none; }

        .status-badge { width: 100%; padding: 6px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; font-size: 0.8rem; text-align: center; }
        .status-processing { background-color: #8b5cf6; color: white; }
        .status-success { background-color: #10b981; color: white; }
        .status-error { background-color: #ef4444; color: white; }
        .status-pending { background-color: #374151; color: #9ca3af; }

        .img-container { width: 100%; height: 220px; background: #000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-container img { display: block; max-width: 100%; max-height: 100%; }

        .file-size-info { font-size: 0.75rem; color: #34d399; margin-top: 4px; font-weight: bold; }

        .button-group { width: 100%; display: flex; gap: 8px; }
        button.action-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }

        .crop-btn { background-color: #3b82f6; color: white; }
        .crop-btn:hover { background-color: #2563eb; }

        .download-btn { background-color: #00ff99; color: #000; }
        .download-btn:hover:not(:disabled) { background-color: #00cc7a; }
        .download-btn:disabled { background-color: #444; color: #888; cursor: not-allowed; opacity: 0.6; }

        .delete-card { background-color: #ef4444; color: white; margin-top: 8px; width: 100%; padding: 6px; font-size: 0.8rem; }
        .delete-card:hover { background-color: #dc2626; }

        #fab-download-all {
            position: fixed; bottom: 30px; right: 30px; width: 75px; height: 75px;
            background-color: #00ff99; border-radius: 50%; box-shadow: 0 6px 15px rgba(0, 255, 153, 0.4);
            display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; border: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        #fab-download-all:hover { transform: scale(1.1); background-color: #00cc7a; }
        #fab-download-all svg { width: 35px; height: 35px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>AI Photo & Signature Cropper</h2>
        <p>Captures and compresses photos & signatures automatically between 10KB to 50KB.</p>
        <div id="status">⏳ Downloading AI Face Models... please wait.</div>
        <button id="add-person-btn" class="add-card-btn" onclick="addNewCard()" disabled>➕ Add New Person</button>
    </div>

    <div id="grid-container"></div>

    <button id="fab-download-all" onclick="downloadAllZip()" title="Download All Pairs (ZIP)">
        <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        let isAiLoaded = false;
        let cardCounter = 0;
        const statusDiv = document.getElementById('status');
        const addBtn = document.getElementById('add-person-btn');
        const gridContainer = document.getElementById('grid-container');
        const fab = document.getElementById('fab-download-all');

        let pairRegistry = [];

        async function loadAI() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            isAiLoaded = true;
            statusDiv.textContent = "✅ AI Ready! Click below to start adding profiles.";
            statusDiv.style.color = "#00ff99";
            addBtn.disabled = false; 
        }
        loadAI();

        function addNewCard() {
            fab.style.display = 'flex';
            cardCounter++;
            const defaultName = `person_${cardCounter}`;

            const record = {
                id: cardCounter,
                customName: defaultName,
                photoBlob: null,
                signBlob: null,
                isReady: false
            };
            pairRegistry.push(record);

            const card = document.createElement('div');
            card.className = 'crop-card';
            card.id = `card-${record.id}`;

            card.innerHTML = `
                <div class="naming-box">
                    <label>File Name (Renames both Photo & Signature):</label>
                    <input type="text" value="${record.customName}">
                </div>
                <div class="pair-container">
                    <div class="pane">
                       <!-- <div class="pane-title">📷 Passport Photo</div> -->
                        <label class="file-label">
                            📸 Capture Photo
                            <input type="file" class="photo-input" accept="image/*" capture="environment">
                        </label>
                        <div class="status-badge status-pending">Awaiting Image</div>
                        <div class="img-container"><img class="photo-img"></div>
                        <div class="file-size-info photo-size"></div>
                    </div>
                    <div class="pane">
                       <!-- <div class="pane-title">✍️ Signature</div> -->
                        <label class="file-label">
                            ✍️ Capture Signature
                            <input type="file" class="sign-input" accept="image/*" capture="environment">
                        </label>
                        <div class="status-badge status-pending">Awaiting Image</div>
                        <div class="img-container"><img class="sign-img"></div>
                        <div class="file-size-info sign-size"></div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="action-btn crop-btn" disabled>✂️ Confirm & Compress (10-50KB)</button>
                    <button class="action-btn download-btn" disabled>⬇ Download Pair</button>
                </div>
               <!-- <button class="action-btn delete-card" onclick="removeCard(${record.id})">🗑️ Remove Profile</button> -->
            `;

            gridContainer.appendChild(card);

            const nameInput = card.querySelector('.naming-box input');
            const photoInput = card.querySelector('.photo-input');
            const signInput = card.querySelector('.sign-input');
            const photoImg = card.querySelector('.photo-img');
            const signImg = card.querySelector('.sign-img');
            const photoStatus = card.querySelectorAll('.status-badge')[0];
            const signStatus = card.querySelectorAll('.status-badge')[1];
            const photoSizeInfo = card.querySelector('.photo-size');
            const signSizeInfo = card.querySelector('.sign-size');
            const cropBtn = card.querySelector('.crop-btn');
            const downloadBtn = card.querySelector('.download-btn');

            let photoCropper = null;
            let signCropper = null;
            let photoLoaded = false;
            let signLoaded = false;

            nameInput.addEventListener('input', (e) => {
                record.customName = e.target.value.trim() || "untitled";
            });

            photoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                photoStatus.textContent = '⏳ Scanning Face...';
                photoStatus.className = 'status-badge status-processing';
                photoImg.src = URL.createObjectURL(file);

                photoImg.onload = () => {
                    if (photoCropper) photoCropper.destroy();
                    photoCropper = new Cropper(photoImg, {
                        aspectRatio: 3 / 4,
                        viewMode: 1,
                        autoCropArea: 0.6,
                        async ready() {
                            if (!isAiLoaded) return;
                            const detection = await faceapi.detectSingleFace(photoImg, new faceapi.TinyFaceDetectorOptions());
                            if (detection) {
                                const face = detection.box;
                                const targetHeight = face.height * 2.1; 
                                const targetWidth = targetHeight * 0.75; 
                                const targetX = (face.x + face.width / 2) - (targetWidth / 2);
                                const targetY = face.y - (targetHeight * 0.22); 
                                photoCropper.setData({ x: targetX, y: targetY, width: targetWidth, height: targetHeight });
                                photoStatus.textContent = '✨ Face Framed!';
                                photoStatus.className = 'status-badge status-success';
                            } else {
                                photoStatus.textContent = '❌ Adjust Manually';
                                photoStatus.className = 'status-badge status-error';
                            }
                            photoLoaded = true;
                            checkBothLoaded();
                        }
                    });
                };
            });

            signInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                signStatus.textContent = '✨ Ready to Crop';
                signStatus.className = 'status-badge status-success';
                signImg.src = URL.createObjectURL(file);

                signImg.onload = () => {
                    if (signCropper) signCropper.destroy();
                    signCropper = new Cropper(signImg, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        autoCropArea: 0.8
                    });
                    signLoaded = true;
                    checkBothLoaded();
                };
            });

            function checkBothLoaded() {
                if (photoLoaded && signLoaded) {
                    cropBtn.disabled = false;
                }
            }

            // Helper function to compress canvas into JPEG blob between 10KB and 50KB
            async function compressCanvasToTargetSize(canvas, minBytes = 10240, maxBytes = 51200) {
                let quality = 0.90;
                let scale = 1.0;
                
                // Helper to generate blob at current scale and quality
                const getBlob = (currentCanvas, q) => {
                    return new Promise(resolve => currentCanvas.toBlob(resolve, 'image/jpeg', q));
                };

                let workCanvas = canvas;

                // Loop to hit the target sizing window
                for (let attempt = 0; attempt < 6; attempt++) {
                    let blob = await getBlob(workCanvas, quality);
                    
                    if (blob.size >= minBytes && blob.size <= maxBytes) {
                        return blob;
                    }

                    if (blob.size > maxBytes) {
                        // Too large: reduce quality or scale down dimensions
                        if (quality > 0.3) {
                            quality -= 0.15;
                        } else {
                            scale *= 0.85;
                            workCanvas = resizeCanvas(canvas, scale);
                            quality = 0.7;
                        }
                    } else if (blob.size < minBytes) {
                        // Too small: increase quality or scale up dimensions slightly if possible
                        if (quality < 0.95) {
                            quality += 0.15;
                        } else {
                            break; // Stop if max quality reached and still under 10KB
                        }
                    }
                }
                
                // Fallback return final generated blob
                return await getBlob(workCanvas, quality);
            }

            function resizeCanvas(sourceCanvas, scale) {
                let newCanvas = document.createElement('canvas');
                newCanvas.width = Math.floor(sourceCanvas.width * scale);
                newCanvas.height = Math.floor(sourceCanvas.height * scale);
                let ctx = newCanvas.getContext('2d');
                ctx.drawImage(sourceCanvas, 0, 0, newCanvas.width, newCanvas.height);
                return newCanvas;
            }

            cropBtn.addEventListener('click', async () => {
                const pCanvas = photoCropper.getCroppedCanvas({ width: 600, height: 800 });
                const sCanvas = signCropper.getCroppedCanvas({ width: 800, height: 300 });
                if (!pCanvas || !sCanvas) return;

                cropBtn.textContent = '⏳ Compressing...';
                cropBtn.disabled = true;

                // Compress both to 10KB - 50KB target range using JPEG format
                record.photoBlob = await compressCanvasToTargetSize(pCanvas);
                record.signBlob = await compressCanvasToTargetSize(sCanvas);
                record.isReady = true;

                // Display sizes on screen for confirmation
                photoSizeInfo.textContent = `Size: ${(record.photoBlob.size / 1024).toFixed(1)} KB`;
                signSizeInfo.textContent = `Size: ${(record.signBlob.size / 1024).toFixed(1)} KB`;

                photoCropper.destroy();
                signCropper.destroy();

                photoImg.src = URL.createObjectURL(record.photoBlob);
                signImg.src = URL.createObjectURL(record.signBlob);

                photoStatus.style.display = 'none';
                signStatus.style.display = 'none';
                cropBtn.style.display = 'none';
                photoInput.parentElement.style.display = 'none';
                signInput.parentElement.style.display = 'none';
                downloadBtn.disabled = false;
            });

            downloadBtn.addEventListener('click', () => {
                if (!record.isReady) return;
                triggerPairDownload(record);
            });
        }

        function removeCard(id) {
            const cardEl = document.getElementById(`card-${id}`);
            if (cardEl) cardEl.remove();
            pairRegistry = pairRegistry.filter(r => r.id !== id);
            if (pairRegistry.length === 0) {
                fab.style.display = 'none';
            }
        }

        function triggerPairDownload(record) {
            let zip = new JSZip();
            zip.file(record.customName + "_photo.jpg", record.photoBlob);
            zip.file(record.customName + "_sign.jpg", record.signBlob);

            zip.generateAsync({ type: "blob" }).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = record.customName + "_pair.zip";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        async function downloadAllZip() {
            const unconfirmed = pairRegistry.filter(r => !r.isReady);
            if (unconfirmed.length > 0) {
                alert(`⚠️ Please make sure all profiles have images uploaded and processed.`);
                return;
            }

            fab.innerHTML = "⏳";
            fab.style.pointerEvents = "none";

            const zip = new JSZip();
            pairRegistry.forEach(record => {
                zip.file(record.customName + "_photo.jpg", record.photoBlob);
                zip.file(record.customName + "_sign.jpg", record.signBlob);
            });

            const zipContent = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipContent);
            link.download = "All_Compressed_Photos_And_Signatures.zip";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            fab.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>`;
            fab.style.pointerEvents = "auto";
        }
    </script>
</body>
</html>
